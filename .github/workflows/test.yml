name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-test:
    name: Backend Jest + Supertest tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test

  selenium-e2e-tests:
    name: Frontend Selenium E2E tests
    runs-on: ubuntu-latest
    needs: npm-test
    env:
      JWT_SECRET: ci-test-secret
    steps:
      - uses: actions/checkout@v4

      - name: Start application with Docker Compose
        run: docker compose up -d --build --wait

      - name: Check running containers
        if: always()
        run: docker compose ps --all

      - name: Set up Node.js for Selenium tests
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend-test/package-lock.json

      - name: Install Selenium test dependencies
        working-directory: frontend-test
        run: npm ci

      - name: Run Selenium E2E tests
        working-directory: frontend-test
        env:
          BASE_URL: http://localhost:8080
        run: npm test

      - name: Show Docker logs if tests fail
        if: failure()
        run: docker compose logs

      - name: Stop Docker Compose
        if: always()
        run: docker compose down
